name: Account and Key Generator

on:
 # schedule: #if need schedule 
 #   - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      account:
        description: 'Number of Accounts to be generated (default = 0)'
        required: false
        default: '0'
        type: string
      key:
        description: 'Number of Keys to be generated (default = 1)'
        required: false
        default: '1'
        type: string
      mail:
        description: 'Choose the mail provider to generate license'
        required: true
        type: choice
        options:
          - fakemail
          - emailfake
          - inboxes
        default: emailfake
      key_type:
        description: 'Modes of operation'
        required: true
        type: choice
        options:
          - --key
          - --small-business-key
        default: --key
      os:
        description: 'Operating System of runner (Linux, macOS, Windows)'
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        default: windows-latest
      branch:
        description: "Repository branch (don't touch it if you don't know what it is!!!)"
        required: false
        type: choice
        options:
          - main
          - test
        default: main

jobs:
  generate-account-and-key:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.os || 'windows-latest' }} #if fallback then
    steps:
      - name: Set Variables
        id: vars
        shell: bash 
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "account=${{ github.event.inputs.account }}" >> $GITHUB_OUTPUT
            echo "key=${{ github.event.inputs.key }}" >> $GITHUB_OUTPUT
            echo "mail=${{ github.event.inputs.mail }}" >> $GITHUB_OUTPUT
            echo "key_type=${{ github.event.inputs.key_type }}" >> $GITHUB_OUTPUT
            echo "branch=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
          else #if fallback then
            echo "account=0" >> $GITHUB_OUTPUT
            echo "key=1" >> $GITHUB_OUTPUT
            echo "mail=emailfake" >> $GITHUB_OUTPUT
            echo "key_type=--key" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Repository
        run: git clone -b "${{ steps.vars.outputs.branch }}" https://github.com/shadowcopyrz/etkg.git

      - name: Setup & Run Script (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd etkg
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install python@3.11 || true
          else
            sudo apt update
            sudo apt install -y python3-pip python3-venv
          fi

          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

          ACCOUNT="${{ steps.vars.outputs.account }}"
          KEY="${{ steps.vars.outputs.key }}"
          MAIL="${{ steps.vars.outputs.mail }}"
          KEY_TYPE="${{ steps.vars.outputs.key_type }}"

          if [[ "$ACCOUNT" != "0" ]]; then
            python3 main.py --auto-detect-browser --account --email-api "$MAIL" --skip-update-check --no-logo --disable-progress-bar --repeat "$ACCOUNT"

            echo "### Account result" >> "$GITHUB_STEP_SUMMARY"
            if compgen -G "./*ACCOUNTS.txt" > /dev/null; then
              cat ./*ACCOUNTS.txt >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ No ACCOUNTS.txt file was generated. The generator did not complete successfully." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::No account output was generated. Check the generator log above; the selected mail provider may have failed."
              exit 1
            fi
          fi

          if [[ "$KEY" != "0" ]]; then
            python3 main.py --auto-detect-browser "$KEY_TYPE" --email-api "$MAIL" --skip-update-check --no-logo --disable-progress-bar --repeat "$KEY"

            echo -e "\n### Key result" >> "$GITHUB_STEP_SUMMARY"
            if compgen -G "./*KEYS.txt" > /dev/null; then
              cat ./*KEYS.txt >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ No KEYS.txt file was generated. The generator did not complete successfully." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::No key output was generated. Check the generator log above; the selected mail provider may have failed."
              exit 1
            fi
          fi

      - name: Setup & Run Script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd etkg
          python -m venv venv
          .\venv\Scripts\pip install -r requirements.txt
          .\venv\Scripts\Activate.ps1

          $ACCOUNT = "${{ steps.vars.outputs.account }}"
          $KEY = "${{ steps.vars.outputs.key }}"
          $MAIL = "${{ steps.vars.outputs.mail }}"
          $KEY_TYPE = "${{ steps.vars.outputs.key_type }}"

          if ($ACCOUNT -ne "0") {
            python main.py --auto-detect-browser --account --email-api "$MAIL" --skip-update-check --no-logo --disable-progress-bar --repeat $ACCOUNT
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Generator exited with code $LASTEXITCODE while creating accounts."
              exit $LASTEXITCODE
            }

            "### Account result" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $accountFiles = @(Get-ChildItem -Path . -Filter "*ACCOUNTS.txt" -File -ErrorAction SilentlyContinue)
            if ($accountFiles.Count -gt 0) {
              Get-Content -Path $accountFiles.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            else {
              "❌ No ACCOUNTS.txt file was generated. The generator did not complete successfully." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Write-Error "No account output was generated. Check the generator log above; the selected mail provider may have failed."
              exit 1
            }
          }

          if ($KEY -ne "0") {
            python main.py --auto-detect-browser "$KEY_TYPE" --email-api "$MAIL" --skip-update-check --no-logo --disable-progress-bar --repeat $KEY
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Generator exited with code $LASTEXITCODE while creating keys."
              exit $LASTEXITCODE
            }

            "`n### Key result" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $keyFiles = @(Get-ChildItem -Path . -Filter "*KEYS.txt" -File -ErrorAction SilentlyContinue)
            if ($keyFiles.Count -gt 0) {
              Get-Content -Path $keyFiles.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            else {
              "❌ No KEYS.txt file was generated. The generator did not complete successfully." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Write-Error "No key output was generated. Check the generator log above; the selected mail provider may have failed."
              exit 1
            }
          }
